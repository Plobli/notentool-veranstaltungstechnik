# Fester Projektname: hält Container-/Volume-Namen (prfungskommission_app-data
# mit den produktiven Daten) stabil, unabhängig davon, wie der Verzeichnisname
# "Prüfungskommission" (ü) transliteriert wird. Nicht ändern.
name: prfungskommission

services:
  app:
    # Fertiges Image aus der GitHub Container Registry (GHCR). Wird bei jedem
    # Push auf main automatisch per GitHub Actions gebaut (.github/workflows/
    # docker.yml). Update auf dem Server: in Dockge "Pull" + Restart.
    # `build: .` bleibt als Fallback für lokale Entwicklung (docker compose
    # up --build); für den Server-Pull ist `image:` maßgeblich.
    image: ghcr.io/plobli/notentool-veranstaltungstechnik:latest
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/app/data/pruefung.sqlite
      - NODE_ENV=production
    volumes:
      - app-data:/app/data
    expose:
      - "3000"

  # Automatisches tägliches Voll-Backup der Datenbank in app-data/backups.
  # Nutzt dasselbe Image wie app (better-sqlite3 vorhanden), aber ein anderes
  # Startkommando. BACKUP_KEEP steuert die Aufbewahrung (ältere werden gelöscht).
  backup:
    image: ghcr.io/plobli/notentool-veranstaltungstechnik:latest
    build: .
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/pruefung.sqlite
      - BACKUP_DIR=/app/data/backups
      - BACKUP_KEEP=30
      - BACKUP_INTERVAL=86400
    volumes:
      - app-data:/app/data
    command: ["sh", "/app/scripts/backup-loop.sh"]
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
