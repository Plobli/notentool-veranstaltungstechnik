# Fester Projektname: hält Container-/Volume-Namen (prfungskommission_app-data
# mit den produktiven Daten) stabil, unabhängig davon, wie der Verzeichnisname
# "Prüfungskommission" (ü) transliteriert wird. Nicht ändern.
name: prfungskommission

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/app/data/pruefung.sqlite
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    volumes:
      - app-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
